apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: aws-secrets-provider
  namespace: paysecure
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "paysecure/production/db-credentials"
        objectType: "secretsmanager"
      - objectName: "paysecure/production/bank-api-certificates"
        objectType: "secretsmanager"
