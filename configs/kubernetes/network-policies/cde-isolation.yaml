# PCI-DSS Requirement 1.3: Quarantined Cardholder Data Environment
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cde-isolation-policy
  namespace: paysecure-cde
spec:
  podSelector:
    matchLabels:
      app: tokenisation-service
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: paysecure
      podSelector:
        matchLabels:
          app: payment-api
    ports:
    - protocol: TCP
      port: 8443
  egress:
  - to:
    - ipBlock:
        cidr: 10.100.30.0/24
    - ipBlock:
        cidr: 10.200.30.0/24
    ports:
    - protocol: TCP
      port: 5432
